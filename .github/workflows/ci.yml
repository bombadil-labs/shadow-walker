name: Validate guided walk
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve dependencies (lockfile bootstrap)
        run: npm install
      - name: Inspect dependency vulnerabilities
        run: npm audit --audit-level=high
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-artifacts
          path: |
            package-lock.json
            playwright-report/
            test-results/
          if-no-files-found: ignore

  bootstrap-lock:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/m1-guided-walk'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m1-guided-walk
      - uses: actions/download-artifact@v4
        with:
          name: validation-artifacts
          path: /tmp/shadow-walker-validation
      - name: Preserve only the successfully validated dependency lock
        run: |
          test ! -e package-lock.json || exit 0
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cp /tmp/shadow-walker-validation/package-lock.json package-lock.json
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("package.json","utf8")); const l=JSON.parse(fs.readFileSync("package-lock.json","utf8")); for(const field of ["dependencies","devDependencies"]) if(JSON.stringify(p[field])!==JSON.stringify(l.packages[""][field])) throw new Error("Lock manifest mismatch");'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          git commit -m 'build: preserve the CI-validated dependency lockfile'
          git push origin HEAD:refs/heads/feat/m1-guided-walk
