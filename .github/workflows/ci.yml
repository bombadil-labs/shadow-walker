name: Validate Shadow Walker
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  quality:
    name: typecheck, build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run build

  native:
    name: native domain and storage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run test:core

  integration:
    name: MCP and HTTP integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - run: npm run test:integration

  browser:
    name: browser ${{ matrix.surface }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - surface: embedded-app
            command: npx playwright test tests/ui.spec.ts
          - surface: phase3-layers
            command: npx playwright test tests/ui.spec.ts --grep "Flight Lines structural ecology is available"
          - surface: phase3-geometry
            command: npx playwright test tests/ui.spec.ts --grep "map is left-to-right"
          - surface: phase3-outline
            command: npx playwright test tests/ui.spec.ts --grep "outline shares selection"
          - surface: standalone-review
            command: npx playwright test tests/dashboard.spec.ts --grep "standalone page opens"
          - surface: standalone-picker
            command: npx playwright test tests/dashboard.spec.ts --grep "exploration picker"
          - surface: standalone-landing
            command: npx playwright test tests/dashboard.spec.ts --grep "public landing page"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.surface }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
